[project]
name = "aimodels-searchapis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.30.0",
    "alembic>=1.19.1",
    "duckduckgo-search>=8.1.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "litellm>=1.96.0",
    "openai-whisper>=20250625",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sentry-sdk[fastapi]>=2.67.1",
    "kokoro-onnx>=0.3.0",
    "soundfile>=0.12.0",
    "sqlalchemy>=2.0.52",
    "upstash-redis>=1.7.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PLC"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments (FastAPI pattern)
    "PLC0415",# import-outside-toplevel (we use lazy imports intentionally)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
