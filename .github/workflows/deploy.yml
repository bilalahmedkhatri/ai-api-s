name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    # Only deploy when CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Registry login ─────────────────────────────────────────────────────
      # Set REGISTRY, REGISTRY_USERNAME, REGISTRY_PASSWORD in GitHub Secrets.
      # For Docker Hub : REGISTRY=docker.io
      # For AWS ECR    : REGISTRY=<account>.dkr.ecr.<region>.amazonaws.com
      # For GHCR       : REGISTRY=ghcr.io
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Build & push ────────────────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Rolling restart (provider-agnostic webhook) ─────────────────────────
      # Set DEPLOY_WEBHOOK_URL in GitHub Secrets.
      # Render: Dashboard → Service → Settings → Deploy Hook URL
      # DigitalOcean / Fly.io / Railway: equivalent deploy webhook
      - name: Trigger rolling restart
        if: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"image": "${{ steps.meta.outputs.tags }}"}'
        shell: bash
