services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  gateway:
    build:
      context: .
      target: runtime # use the slim runtime stage
    image: ai-gateway:local
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      # Logs available on host for tail/grep during development.
      - ./logs:/app/logs
    environment:
      # These values are read by app/core/config.py via Pydantic BaseSettings.
      # Override with a real .env file or Docker secrets in production.
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/gateway"
      DEBUG: "false"
      WORKERS: "1"
      # Populate these from your shell environment or a .env file:
      # OPENAI_API_KEY, GROQ_API_KEY, COHERE_API_KEY,
      # TAVILY_API_KEY, BRAVE_API_KEY,
      # UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN,
      # SENTRY_DSN,
      # LITESTREAM_ACCESS_KEY_ID, LITESTREAM_SECRET_ACCESS_KEY, LITESTREAM_S3_BUCKET
    env_file:
      - .env # loaded when file exists; silently skipped otherwise
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    driver: local
